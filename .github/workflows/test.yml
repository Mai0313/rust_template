name: Tests

# The diff decides whether the suite runs, never the branch name: a conventional-commits type says
# what a change is for and nothing about what it touched, so a `chore/`, `ci/` or `docs/` branch
# carrying code has to be tested like any other. The `paths-ignore` below is what skips pure prose.
on:
  push:
    branches:
      - main
      - master
      - release/*
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
      - master
      - release/*
    paths-ignore:
      - "**/*.md"

permissions: write-all

jobs:
  run_tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Build
        run: |
          cargo build --locked --verbose

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.86.6
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info --quiet
          cargo llvm-cov report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7
